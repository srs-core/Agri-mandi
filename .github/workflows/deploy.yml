name: Build and Deploy Monorepo App

on:
  push:
    branches: ["main"] # Change to "master" if your primary branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 1: Install dependencies (if you have root package.json or subfolder)
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install; fi
          if [ -f apps/web/package.json ]; then cd apps/web && npm install; elif [ -f web/package.json ]; then cd web && npm install; fi

      # Step 2: Build the Vite project inside the subfolder
      - name: Build Vite App
        run: |
          if [ -d "apps/web" ]; then
            cd apps/web && npm run build
          elif [ -d "web" ]; then
            cd web && npm run build
          fi

      # Step 3: Upload the built 'dist' folder from the subfolder
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist' # If your path is just 'web/dist', change this to './web/dist'

      # Step 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
